name: Build and Release

on:
  push:
    tags:
      - '*.*.*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install vsce
      run: npm install -g @vscode/vsce
      
    - name: Build extension
      run: vsce package
      
    - name: Get package info
      id: package
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
        echo "filename=$PACKAGE_NAME-$PACKAGE_VERSION.vsix" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.package.outputs.filename }}
        generate_release_notes: true
        body: |
          ## Script Notes v${{ steps.package.outputs.version }}
          
          A VS Code extension to manage and run shell commands with a UI similar to the test explorer.
          
          ### 📥 Installation
          
          **Option 1: Install from VSIX**
          ```bash
          code --install-extension ${{ steps.package.outputs.filename }}
          ```
          
          **Option 2: Install via VS Code UI**
          1. Download the `.vsix` file below
          2. Open VS Code
          3. Go to Extensions view (Ctrl+Shift+X / Cmd+Shift+X)
          4. Click the `...` menu at the top
          5. Select "Install from VSIX..."
          6. Choose the downloaded file
          
          ### ✨ Features
          - 📁 Organize commands in folders
          - 🔄 Drag and drop to reorder commands and folders
          - ⚡ Run commands with custom arguments
          - 💾 Persistent argument history
          - 📤 Import/Export commands
          - 🎨 Clean, integrated UI
          
          ---
        draft: false
        prerelease: false